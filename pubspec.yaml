name: unifriend
description: "UniFriend, a complete companion for university students."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_animate: ^4.5.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon. Source art is in assets/icon/. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#05060B"
    theme_color: "#7B93FF"
  windows:
    generate: true
    image_path: assets/icon/icon.png
  macos:
    generate: true
    image_path: assets/icon/icon.png
